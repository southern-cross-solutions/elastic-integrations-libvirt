format_version: 3.5.0
name: libvirt
title: "Libvirt/KVM"
version: 0.5.0
source:
  license: "Elastic-2.0"
description: "Collects Libvirt/KVM hypervisor state metrics (VM counts and states)."
type: integration
categories:
  - custom
  - monitoring
conditions:
  kibana:
    version: "^8.17.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/libvirt-logo.svg
    title: Libvirt Logo
    size: 32x32
    type: image/svg+xml
screenshots:
  - src: /img/libvirt-logo.svg
    title: Libvirt Logo
    size: 600x600
    type: image/svg+xml
owner:
  github: southern-cross-solutions
  type: community

policy_templates:
  - name: libvirt_metrics
    title: Libvirt VM Metrics
    description: Poll the Libvirt metrics API endpoint at intervals and ingest JSON results.
    inputs:
      - type: httpjson
        title: VM State Exporter Endpoint Configuration
        description: Polls the libvirt-exporter API and ingests JSON output
        vars:
          - name: interval
            type: text
            title: Polling Interval
            default: "1m"
            required: true
            multi: false
            show_user: true
          - name: api_endpoint
            type: text
            title: API Endpoint
            default: "http://127.0.0.1:8088/v1/states"
            required: true
            multi: false
            show_user: true
