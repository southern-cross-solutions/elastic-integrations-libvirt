format_version: 3.5.0
name: libvirt
title: "Libvirt/KVM"
version: 0.6.1
# source:
#   license: "Elastic-2.0"
description: "Collects Libvirt/KVM hypervisor state metrics (VM counts and states)."
type: integration
categories:
  - custom
  - monitoring
conditions:
  kibana:
    version: "^8.17.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/libvirt-logo.svg
    title: Libvirt Logo
    size: 600x600
    type: image/svg+xml
icons:
  - src: /img/libvirt-logo.svg
    title: Libvirt Logo
    size: 32x32
    type: image/svg+xml
owner:
  github: southern-cross-solutions
  type: community

policy_templates:
  - name: kvm
    title: Libvirt VM Metrics
    description: Collect the state metrics from Libvirt/KVM hypervisors.
    inputs:
      - type: kvm/metrics
        title: Collect the state metrics from Libvirt/KVM hypervisors.
        description: Collect the state metrics from Libvirt/KVM hypervisors.
        vars:
          - name: hosts
            type: text
            title: KVM Connection String.
            multi: true
            required: true
            show_user: true
            default:
              # - unix:///var/run/libvirt/libvirt-sock
              - qemu:///system
          - name: period
            type: text
            title: Period
            required: true
            default:
              - 10s
